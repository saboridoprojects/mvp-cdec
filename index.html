<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de competências – CDEC - Evoluindo Talentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --text:#121A26; --muted:#4A5565; --border:#D9DEE5; --strong:#7B8696;
  --brand:#C24A00; --brand-hover:#9F3C00; --on-brand:#FFFFFF; --tint:#FFF0E5; --track:#E3E7ED; --soft:#EEF0F3;
  --d1:#C24A00; --d2:#FFB680; --d3:#D1455F;
  --c1:#7C2D12; --c2:#C24A00; --c3:#F65E00; --c4:#FF8A3D; --c5:#FFB680;
  --o-main:#C24A00; --o-hover:#9F3C00; --o-on:#FFFFFF; --o-panel:#D9682B; --o-tint:#FFF0E5; --o-tint2:#FFE3CF; --o-line:#FFB680; --o-ink:#9A3A00;
  --pf-d:#c8372d; --pf-i:#d98e04; --pf-s:#2f8f5b; --pf-c:#2a61c4;
  --lv0:#EEF0F3; --lv0t:#4A5565; --lv1:#FFF0E5; --lv1t:#3B1500; --lv2:#FFD9BD; --lv2t:#3B1500;
  --lv3:#FFB27A; --lv3t:#3B1500; --lv4:#C24A00; --lv4t:#FFFFFF; --lv5:#8F3500; --lv5t:#FFFFFF;
  --ok-bg:#E6F4EA; --ok-border:#8CC7A0; --ok-text:#0F3D1F;
  --warn-bg:#FFF1E0; --warn-border:#E0A25A; --warn-text:#5A3200;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#161E28; --text:#E8EDF3; --muted:#A3AEBD; --border:#2A3543; --strong:#6B7788;
    --brand:#FF7A1A; --brand-hover:#FF9142; --on-brand:#2B1204; --tint:#2B170C; --track:#2A3543; --soft:#202B38;
    --d1:#FF7A1A; --d2:#8F4A12; --d3:#F07A92;
    --lv0:#1E2833; --lv0t:#A3AEBD; --lv1:#3A2010; --lv1t:#FFE3CF; --lv2:#5C3014; --lv2t:#FFF0E5;
    --lv3:#8F4A12; --lv3t:#FFFFFF; --lv4:#FF7A1A; --lv4t:#2B1204; --lv5:#FFA55C; --lv5t:#2B1204;
    --ok-bg:#12301E; --ok-border:#2F7A4B; --ok-text:#CDEBD8;
    --warn-bg:#3A2A12; --warn-border:#A9772F; --warn-text:#F3DDB8;
    --c1:#FFD7B8; --c2:#FFB680; --c3:#FF8F3F; --c4:#E8650A; --c5:#B84700;
  --o-main:#FF7A1A; --o-hover:#FF9142; --o-on:#2B1204; --o-panel:#A9511F; --o-tint:#2B170C; --o-tint2:#3B1F0F; --o-line:#7C3A12; --o-ink:#FFB680;
  --pf-d:#ff7a6e; --pf-i:#f2b440; --pf-s:#5fcf93; --pf-c:#7ea8f5;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E28; --text:#E8EDF3; --muted:#A3AEBD; --border:#2A3543; --strong:#6B7788;
  --brand:#FF7A1A; --brand-hover:#FF9142; --on-brand:#2B1204; --tint:#2B170C; --track:#2A3543; --soft:#202B38;
  --d1:#FF7A1A; --d2:#8F4A12; --d3:#F07A92;
  --lv0:#1E2833; --lv0t:#A3AEBD; --lv1:#3A2010; --lv1t:#FFE3CF; --lv2:#5C3014; --lv2t:#FFF0E5;
  --lv3:#8F4A12; --lv3t:#FFFFFF; --lv4:#FF7A1A; --lv4t:#2B1204; --lv5:#FFA55C; --lv5t:#2B1204;
  --ok-bg:#12301E; --ok-border:#2F7A4B; --ok-text:#CDEBD8;
    --warn-bg:#3A2A12; --warn-border:#A9772F; --warn-text:#F3DDB8;
  --c1:#FFD7B8; --c2:#FFB680; --c3:#FF8F3F; --c4:#E8650A; --c5:#B84700;
  --o-main:#FF7A1A; --o-hover:#FF9142; --o-on:#2B1204; --o-panel:#A9511F; --o-tint:#2B170C; --o-tint2:#3B1F0F; --o-line:#7C3A12; --o-ink:#FFB680;
  --pf-d:#ff7a6e; --pf-i:#f2b440; --pf-s:#5fcf93; --pf-c:#7ea8f5;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.opt:hover,.step-btn:hover{border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost:hover{background:var(--soft)}
h1,h2,h3{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif}
p{margin:0}

.page{min-height:100vh;padding:40px 24px 64px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.hd-text{display:flex;flex-direction:column;gap:8px;flex:1 1 520px;min-width:0}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
h1{margin:0;font-size:clamp(24px,6vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.lead{font-size:16px;line-height:1.5;color:var(--muted);text-wrap:balance}
.prog{flex:0 1 300px;min-width:240px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;font-weight:600}
.prog-row span:first-child{color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>div{height:8px;border-radius:999px;background:var(--brand);transition:width .25s}

.layout{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
nav{flex:1 1 260px;max-width:340px;min-width:0;display:flex;flex-direction:column;gap:8px}
.step-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);text-align:left;color:var(--text)}
.step-btn.active{background:var(--tint);border-color:var(--brand)}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--soft);color:var(--text)}
.step-btn.active .num{background:var(--brand);color:var(--on-brand)}
.step-btn .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.step-btn .t b{font-size:15px;font-weight:600;line-height:1.25}
.step-btn .t small{font-size:13px;line-height:1.3;color:var(--muted)}
.step-btn .st{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--muted)}

main{flex:999 1 560px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px;display:flex;flex-direction:column;gap:28px}
.m-head{display:flex;flex-direction:column;gap:10px}
.m-head .eyebrow{font-size:14px;letter-spacing:.04em}
h2{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.desc{font-size:16px;line-height:1.55;color:var(--muted);max-width:680px}
.desc.wide{max-width:none}
.hint{font-size:15px;color:var(--muted)}

.fields{display:flex;flex-wrap:wrap;gap:20px}
.field{flex:1 1 260px;display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:600}
input[type=text],input[type=date],textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--strong);border-radius:10px;background:var(--surface);font-family:inherit;font-size:16px;color:var(--text)}
textarea{resize:vertical;line-height:1.5}
.note{background:var(--tint);border-radius:12px;padding:16px 18px;font-size:15px;line-height:1.5}

.qlist{display:flex;flex-direction:column;gap:20px}
.q{border:1px solid var(--border);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.q-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.q-num{font-size:13px;font-weight:600;color:var(--muted)}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);background:var(--tint);padding:4px 10px;border-radius:999px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:14px}
legend{padding:0;font-size:17px;line-height:1.45;font-weight:500;margin-bottom:14px}
.scale{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-width:56px;min-height:48px;flex:1 1 56px;max-width:96px;border-radius:10px;border:1px solid var(--strong);background:var(--surface);color:var(--text);font-size:17px;font-weight:600}
.opt[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;padding:10px 16px;border-radius:999px;border:1px solid var(--strong);background:var(--surface);color:var(--text);font-size:15px;font-weight:500}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.block{display:flex;flex-direction:column;gap:14px}
h3{margin:0;font-size:20px;font-weight:600}

.actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--border)}
.actions .right{display:flex;gap:12px;margin-left:auto}
.btn-primary{min-height:48px;padding:10px 24px;border-radius:10px;border:0;background:var(--brand);color:var(--on-brand);font-size:16px;font-weight:600}
.btn-ghost{min-height:48px;padding:10px 24px;border-radius:10px;border:1px solid var(--strong);background:transparent;color:var(--text);font-size:16px;font-weight:600}

[hidden]{display:none!important}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.role-lbl{margin:0 0 4px;font-size:14px;color:var(--muted)}
.role-lbl b{color:var(--text)}
nav .nav-sw{margin-top:8px;min-height:44px;padding:8px 16px;font-size:15px;width:100%}
.q .field,main>.field,.block>.field{flex:none}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.role{border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.role h3{margin:0}
.role p{font-size:15px;line-height:1.5;color:var(--muted)}
.role ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45;color:var(--muted)}
.role .btn-primary{margin-top:auto;align-self:flex-start}
.addrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.addrow .field{flex:1 1 260px}
.link{background:none;border:0;padding:6px;color:var(--brand);font-size:14px;font-weight:600;text-decoration:underline}
.dim{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.dim-l{flex:1 1 180px;font-size:15px;font-weight:600}
.dim-l small{font-weight:400;color:var(--muted);font-size:13px}
.scale4{display:flex;gap:8px}
.scale4 .opt{flex:0 0 56px;min-width:48px}
.tema-n{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;font-size:19px;font-weight:600;overflow-wrap:anywhere}
.chipst{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chipst.ok{background:var(--ok-bg);color:var(--ok-text)}
.chipst.pend{background:var(--tint);color:var(--text)}
.chipst.wait{background:var(--warn-bg);color:var(--warn-text)}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.lvl{min-height:64px;border-radius:10px;border:1px solid var(--strong);background:var(--surface);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:18px;padding:6px}
.lvl small{font-size:12px;font-weight:500}
.lvl .sug{font-weight:600;color:var(--brand)}
.lvl:hover{border-color:var(--brand)}
.lvl[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.lvl[aria-pressed=true] .sug{color:inherit}
.lvl:disabled{opacity:.6;cursor:not-allowed}
.lvbox{display:flex;gap:16px;align-items:flex-start;background:var(--tint);border-radius:12px;padding:14px 16px}
.lvbig{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;font-size:20px;font-weight:700}
.lvbox p{font-size:15px;line-height:1.5;color:var(--muted);margin-top:4px}
.evid{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.selfrow{display:flex;flex-wrap:wrap;gap:8px}
.selfrow span{font-size:14px;background:var(--soft);border-radius:999px;padding:6px 12px}
.err,.warn{font-size:14px;font-weight:600;color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;padding:10px 14px}
.slist{display:flex;flex-direction:column;gap:12px}
.sess{border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sess-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;font-weight:600}
.sess p{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.person{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:15px}
.ritmos{display:flex;flex-direction:column;gap:8px}
.ritmos .chip{text-align:left;border-radius:12px;width:100%}
.tabcap{font-size:13px;line-height:1.4;color:var(--muted);margin:2px 2px 6px}
.locked{position:relative}
.locked input{padding-right:48px;background:var(--soft);color:var(--text);cursor:not-allowed}
.locked svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.chip-sm{min-height:40px;padding:8px 12px;font-size:14px}
.datetag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--tint);border:1px solid var(--o-line);color:var(--o-ink);border-radius:999px;padding:8px 16px 8px 12px;font-size:14px;font-weight:600;line-height:1.3}
.datetag svg{width:18px;height:18px;flex:0 0 auto}
.datetag.idle{background:var(--soft);border-color:var(--border);color:var(--muted);font-weight:500}
.pdi-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px}
.pdi-act input{flex:1 1 260px;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--strong);border-radius:10px;background:var(--surface);color:var(--text);font-family:inherit;font-size:15px}
.field-date{max-width:240px}
.mlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45}
.datebox{position:relative;max-width:300px}
.datefield{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--strong);border-radius:10px;background:var(--surface);color:var(--text);font-size:16px;text-align:left}
.datefield.ph span{color:var(--muted)}
.datefield svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
.calpop{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:320px;max-width:calc(100vw - 48px);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px}
.cal-nav:disabled{opacity:.4;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-day{position:relative;min-height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--text);font-size:15px;font-weight:500}
.cal-day:hover:not(:disabled):not(.on){border-color:var(--brand)}
.cal-day.today{border-color:var(--strong)}
.cal-day.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.cal-day.reg{background:var(--tint)}
.cal-day.reg::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--brand)}
.cal-day:disabled{opacity:.45;cursor:not-allowed}
.cal-ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.cal-ok{min-height:40px;padding:6px 18px;font-size:15px}
.nav-back{display:flex;align-items:center;justify-content:center;gap:8px}
.nav-back svg{width:18px;height:18px}
.field-search{flex:0 1 50%;min-width:260px}
.search{position:relative}
.search input{padding-right:48px}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.cknote{font-size:14px;line-height:1.5;color:var(--muted);padding:0 4px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.subh{font-size:16px;font-weight:600;margin:0}
.lockbox{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5;color:var(--muted)}
.mini-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* página inicial */
.is-home header,.is-home nav{display:none}
.is-home .layout{display:block}
.is-home main{background:none;border:0;border-radius:0;padding:0;gap:0}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:620px;border:1px solid var(--border);border-radius:24px;overflow:hidden;background:var(--surface)}
.hero-brand{background:var(--o-panel);color:#fff;padding:52px 44px 36px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.hero-text{display:flex;flex-direction:column;gap:18px}
.hero-art-wrap{margin-top:auto;padding:0 4px}
.hero-art{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
.hero-title{margin:0;display:flex;flex-direction:column;gap:8px;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;font-weight:800;line-height:1.05;letter-spacing:-.02em;white-space:normal;color:#fff}
.hero-cdec{font-size:clamp(56px,7vw,88px)}
.hero-name{font-size:clamp(26px,2.8vw,34px);font-weight:700;letter-spacing:-.01em}
.hero-sub{margin:0;font-size:20px;font-weight:700;line-height:1.45;color:#fff;max-width:24ch}
.hero-pick{padding:52px 44px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero-pick h2{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.015em}
.pick-help{font-size:17px;line-height:1.5;color:var(--muted);max-width:52ch}
.pick{position:relative;display:flex;gap:16px;align-items:flex-start;padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.pick:hover{border-color:var(--o-main);box-shadow:0 6px 20px rgba(194,74,0,.16)}
.pick:focus-within{outline:3px solid var(--o-main);outline-offset:2px}
.pick-ico{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:var(--o-tint2);color:var(--o-ink);display:flex;align-items:center;justify-content:center}
.pick-ico svg{width:26px;height:26px}
.pick-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.pick-body h3{margin:0;font-size:21px;line-height:1.25}
.pick-body p{font-size:16px;line-height:1.5;color:var(--muted)}
.pick .btn-primary{margin-top:10px;align-self:flex-start;background:var(--o-main);color:var(--o-on)}
.pick .btn-primary:hover{background:var(--o-hover)}

  function donut(segs){
    var R=62,C=2*Math.PI*R,total=segs.reduce(function(a,s){return a+s.v},0);
    var svg='<svg viewBox="0 0 170 170" role="img" aria-label="Gráfico de rosca"><g transform="rotate(-90 85 85)"><circle cx="85" cy="85" r="'+R+'" fill="none" stroke="var(--track)" stroke-width="34"/>';
    if(total>0){
      var off=0;
      segs.forEach(function(s){
        var len=s.v/total*C;
        if(len>0){svg+='<circle cx="85" cy="85" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="34" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>'}
        off+=len;
      });
    }
    svg+='</g></svg>';
    var lg='<div class="legend">';
    segs.forEach(function(s){
      lg+='<div><span class="sw" style="background:'+s.color+'"></span><span>'+s.label+' – '+(total>0?pct(s.v/total*100):'—')+'</span></div>';
    });
    lg+='</div>';
    return '<div class="donut-row">'+svg+lg+'</div>';
  }

  function sector(cx,cy,r0,r1,a0,a1){
    if(a1-a0>=2*Math.PI-0.001){a1=a0+2*Math.PI-0.001}
    var large=(a1-a0)>Math.PI?1:0;
    function P(r,a){return (cx+r*Math.sin(a)).toFixed(2)+' '+(cy-r*Math.cos(a)).toFixed(2)}
    return 'M'+P(r1,a0)+' A'+r1+' '+r1+' 0 '+large+' 1 '+P(r1,a1)+' L'+P(r0,a1)+' A'+r0+' '+r0+' 0 '+large+' 0 '+P(r0,a0)+' Z';
  }
  function compChart(vals,nm){
    var total=0;COMPS.forEach(function(c){total+=vals[c.key]||0});
    var R1=112,R0=56,RM=84,cx=380,cy=160,W=760,H=320;
    var a=0,items=COMPS.map(function(c){
      var v=vals[c.key]||0,share=total>0?v/total:0,a0=a,a1=a+share*2*Math.PI;a=a1;
      var mid=(a0+a1)/2,sn=Math.sin(mid),cs=Math.cos(mid);
      return {c:c,share:share,a0:a0,a1:a1,px:cx+RM*sn,py:cy-RM*cs,ex:cx+(R1+16)*sn,ey:cy-(R1+16)*cs,has:share>0,side:sn>=0?'R':'L'};
    });
    function segs(x,y){
      if(total<=0)return '<path d="'+sector(x,y,R0,R1,0,2*Math.PI)+'" style="fill:var(--track)"/>';
      return items.filter(function(i){return i.has}).map(function(i){
        return '<path d="'+sector(x,y,R0,R1,i.a0,i.a1)+'" style="fill:'+i.c.color+';stroke:var(--surface);stroke-width:2"/>';
      }).join('')+'<circle cx="'+x+'" cy="'+y+'" r="'+R1+'" fill="none" style="stroke:var(--strong);stroke-width:1;opacity:.55"/><circle cx="'+x+'" cy="'+y+'" r="'+R0+'" fill="none" style="stroke:var(--strong);stroke-width:1;opacity:.55"/>';
    }
    function ptxt(i){return total>0?pct(i.share*100):'\u2014'}
    // rosca no centro: os rotulos ficam do lado em que o segmento esta, sem cruzar o miolo
    var lastR=null;
    ['R','L'].forEach(function(sd){
      var list=items.filter(function(i){return i.has&&i.side===sd}).sort(function(p,q){return p.ey-q.ey}),prev=null;
      list.forEach(function(i){
        var n=i.c.lines.length,y=i.ey;
        if(prev){var gap=(prev.n+n)*10.5+12;if(y<prev.y+gap)y=prev.y+gap}
        i.y=y;i.n=n;prev=i;
      });
      if(prev){var over=prev.y+prev.n*10.5-(H-10);if(over>0)list.forEach(function(i){i.y-=over})}
      if(sd==='R')lastR=prev;
    });
    var yy=lastR?lastR.y+34:cy-90;
    items.filter(function(i){return !i.has}).forEach(function(i){i.side='R';i.n=i.c.lines.length;i.y=yy;yy+=i.n*21+12});
    var txt=items.map(function(i){
      var n=i.c.lines.length,right=i.side==='R',x=right?cx+R1+46:cx-R1-46;
      var base=i.y+6-(n-1)*10.5,p=ptxt(i),out='';
      i.c.lines.forEach(function(l,k){out+='<text x="'+x+'" y="'+(base+21*k).toFixed(1)+'" font-size="17" text-anchor="'+(right?'start':'end')+'" style="fill:var(--text)">'+l+(k===n-1?' '+p:'')+'</text>'});
      return out;
    }).join('');
    var lines=items.filter(function(i){return i.has}).map(function(i){
      var xe=i.side==='R'?cx+R1+38:cx-R1-38;
      var d='M'+i.px.toFixed(1)+' '+i.py.toFixed(1)+' L'+i.ex.toFixed(1)+' '+i.ey.toFixed(1)+' L'+xe+' '+i.y.toFixed(1);
      return '<path d="'+d+'" fill="none" stroke-linejoin="round" style="stroke:var(--surface);stroke-width:4"/>'
        +'<path d="'+d+'" fill="none" stroke-linejoin="round" style="stroke:var(--text);stroke-width:1.5"/>'
        +'<circle cx="'+i.px.toFixed(1)+'" cy="'+i.py.toFixed(1)+'" r="3.5" style="fill:var(--text);stroke:var(--surface);stroke-width:1.5"/>';
    }).join('');
    var leg=items.map(function(i){return '<div><span class="sw" style="background:'+i.c.color+'"></span><span>'+i.c.label+' '+ptxt(i)+'</span></div>'}).join('');
    var sr=items.map(function(i){return '<li>'+i.c.label+': '+ptxt(i)+'</li>'}).join('');
    var title=nm?'Compet\u00eancias de '+esc(nm):'Suas compet\u00eancias';
    return '<span class="pill">'+title+'</span>'
      +'<ul class="sr">'+sr+'</ul>'
      +'<div class="cmp-wide"><svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true" style="font-family:Inter,system-ui,sans-serif">'+segs(cx,cy)+lines+txt+'</svg></div>'
      +'<div class="cmp-narrow"><svg viewBox="0 0 270 270" aria-hidden="true">'+segs(135,135)+'</svg><div class="legend">'+leg+'</div></div>'
      +'<p class="cap">Percentual do total de pontos distribu\u00eddo entre as cinco compet\u00eancias.</p>';
  }

  function colabHtml(){
    function card(mod,title,desc,items,btn){
      return '<div class="role"><h3>'+title+'</h3><p>'+desc+'</p><ul>'+items.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul><button type="button" class="btn-primary" data-mod="'+mod+'" data-key="mod-'+mod+'">'+btn+'</button></div>';
    }
    var pfItems=state.pf.done?['Último teste: '+fmtDate(state.pf.doneAt),'Próximo a partir de '+fmtDate(pfNextDate())]:['24 blocos, cerca de 15 minutos','Só você vê o resultado'];
    return '<div class="m-head"><p class="eyebrow">Área do colaborador</p><h2>O que você quer acessar?</h2><p class="desc">Escolha uma opção. Ao abrir, você vê as telas relacionadas a ela.</p></div>'
      +pfBannerHtml()
      +'<div class="roles">'
      +card('mapa','Mapa de competências','Avaliação semestral, respondida a cada 6 meses por todos os funcionários.',['Perfil, conhecimento, habilidade, atitude e engajamento','Resumo do seu mapa de competências'],'Acessar Mapa de competências')
      +card('perfil','Teste de perfil','Descubra como você costuma agir no trabalho. Feito ao entrar na empresa e refeito a cada 6 meses.',pfItems,'Acessar teste de perfil')
      +card('aval','Avaliações','Acompanhe a visão do seu mentor e do seu líder e dê o seu feedback sobre a mentoria e a liderança.',['Visão do mentor e Avaliar mentor','Check-ins do líder e Avaliar líder'],'Acessar Avaliações')
      +'</div><div class="roles">'
      +card('ser','Quero ser mentor','Cadastre o seu perfil para mentorar outras pessoas da empresa.',['Habilidades e projetos em que você atuou','Sua disponibilidade para mentorar'],'Quero ser mentor')
      +card('achar','Quero encontrar um mentor','Conheça quem pode mentorar você.',['Cargo, habilidades e projetos de cada mentor','Busca por nome ou habilidade'],'Encontrar um mentor')
      +'</div>'
      +'<div class="actions"><button type="button" class="btn-ghost" data-top data-key="top">Voltar ao início</button></div>';
  }

  function roleHtml(){
    function card(r,title,desc,items,btn){
      return '<div class="role"><h3>'+title+'</h3><p>'+desc+'</p><ul>'+items.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul><button type="button" class="btn-primary" data-role="'+r+'" data-key="role-'+r+'">'+btn+'</button></div>';
    }
    return '<div class="m-head"><p class="eyebrow">Avaliações</p><h2>Como você vai usar as avaliações?</h2><p class="desc">Escolha o seu papel. Cada papel vê apenas o que o CDEC permite: o conteúdo da mentoria fica entre mentor e mentorado.</p></div>'
      +'<div class="roles">'
      +card('mentorado','Sou mentorado(a)','Acompanhe a visão do seu mentor e os check-ins do seu líder, e avalie a sua mentoria e a sua liderança.',['Você vê: seus níveis por tema, as sessões, a avaliação do ciclo e os check-ins do seu líder','Seu líder só vê os níveis fechados se seu mentor compartilhar; as sessões ficam só com seu mentor'],'Entrar como mentorado(a)')
      +card('mentor','Sou mentor(a)','Registre a sua visão sobre o mentorado: nível por tema, próximos passos das sessões e avaliação do ciclo.',['Você vê: mapa, temas, níveis e sessões do mentorado','Você não vê: check-ins e evidências da gestão'],'Entrar como mentor(a)')
      +card('lider','Sou líder','Acompanhe o desenvolvimento do seu time e registre check-ins de desempenho, engajamento e relacionamento.',['Você vê: a avaliação do ciclo escrita pelo mentor, os seus check-ins e as avaliações anônimas que recebe do time','Você não vê: o conteúdo da mentoria nem as sessões; os níveis por tema só quando o mentor compartilhar'],'Entrar como líder')
      +'</div>'
      +'<div class="note">Neste protótipo os papéis usam o mesmo navegador, para você acompanhar o fluxo completo. Em produção, cada pessoa entraria com o seu login e só veria o que o seu papel permite.</div>'
      +'<div class="actions"><button type="button" class="btn-ghost" data-home data-key="home">Voltar ao início</button></div>';
  }

  /* ---- Mentorado: temas ---- */
  function temasHtml(){
    var T=state.temas,h='<div class="block"><div><h3>Seus temas de trabalho</h3><p class="hint">Liste de 3 a 6 temas, como atendimento ao cliente ou análise de dados, e avalie cada um de 1 a 4.</p></div>';
    h+='<div class="addrow"><div class="field"><label for="f-novoTema">Novo tema</label><input id="f-novoTema" type="text" maxlength="60" placeholder="Ex.: Atendimento ao cliente" data-key="novoTema"></div><button type="button" class="btn-primary" data-addtema data-key="addtema"'+(T.length>=6?' disabled':'')+'>Adicionar tema</button></div></div>';
    if(!T.length){h+='<p class="hint">Nenhum tema ainda. Adicione o primeiro acima.</p>';return h}
    h+='<div class="qlist">';
    T.forEach(function(t,i){
      h+='<div class="q"><div class="q-top"><span class="q-num">Tema '+(i+1)+'</span><button type="button" class="link" data-rmtema="'+t.id+'" data-key="rt-'+t.id+'">Remover</button></div><fieldset><legend>'+esc(t.nome)+'</legend>';
      [['k','Conhecimento','saber'],['h','Habilidade','saber fazer'],['a','Atitude','querer fazer']].forEach(function(dm){
        h+='<div class="dim"><span class="dim-l">'+dm[1]+' <small>('+dm[2]+')</small></span><div class="scale4">';
        for(var n=1;n<=4;n++){
          h+='<button type="button" class="opt" data-tk="'+t.id+'" data-dim="'+dm[0]+'" data-n="'+n+'" data-key="tk-'+t.id+dm[0]+n+'" aria-pressed="'+(t[dm[0]]===n)+'" aria-label="'+dm[1]+', nota '+n+' de 4, tema '+esc(t.nome)+'">'+n+'</button>';
        }
        h+='</div></div>';
      });
      h+='<div class="ends"><span>1 · Pouco</span><span>4 · Muito</span></div></fieldset></div>';
    });
    h+='</div>';
    var inc=T.filter(function(t){return !temaDone(t)}).length;
    h+=inc?'<p class="hint">Faltam notas em '+inc+' tema'+(inc>1?'s':'')+'.</p>':'<p class="hint">Todos os temas foram avaliados.</p>';
    return h;
  }

  /* ---- Mentorado: visão do mentor ---- */
  function sortSess(){return state.mv.sessoes.slice().sort(function(a,b){return a.data<b.data?1:(a.data>b.data?-1:0)})}
  function sessList(list,canDel){
    if(!list.length)return '<p class="hint">Nenhuma sessão registrada ainda.</p>';
    return '<div class="slist">'+list.map(function(s){
      return '<div class="sess"><div class="sess-top"><span>'+fmtDate(s.data)+'</span>'+(canDel?'<button type="button" class="link" data-rmsess="'+s.id+'" data-key="rs-'+s.id+'">Remover</button>':'')+'</div><p>'+esc(s.passos)+'</p></div>';
    }).join('')+'</div>';
  }
  function visaoMentorHtml(){
    var mn=state.mentor.nome?esc(state.mentor.nome):'seu mentor';

  function buildPdf(L) {

      if (y + h > 280) { doc.addPage(); y = 22; }

      doc.setFont("helvetica", style);
      doc.setFontSize(size);
      doc.setTextColor(color[0], color[1], color[2]);
      var lh = size * 0.48;
      doc.splitTextToSize(pdfSafe(str), CW).forEach(function (ln) {
        ensure(lh);
        doc.text(ln, M, y);
        y += lh;
      });
      y += gap || 0;
    }

      text(str, 14, "bold", INK, 1.5);

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  }

    }
    else if(ds.rmsess){state.mv.sessoes=state.mv.sessoes.filter(function(x){return x.id!==ds.rmsess});save();render()}
    else if(ds.mp){var pf=state.mv.perf;if(!pf.r)pf.r={};pf.r[ds.mp]=+ds.n;delete errs.aval;save();render()}
    else if(t.hasAttribute('data-sendaval')){
      var tx=(state.mv.avaliacao||'').trim();
      if(!perfDone()){errs.aval='Responda a todas as perguntas de performance antes de enviar.'}
      else if(!tx||avalBad(tx)){errs.aval='Revise o texto antes de enviar.'}
      else{state.mv.avalPublicada=tx;state.mv.perfPublicada=JSON.parse(JSON.stringify(state.mv.perf||{}));state.mv.avalEnviada=true;state.mv.avalData=today();delete errs.aval}
      save();render();
    }
    else if(t.hasAttribute('data-prev')){go(neighbor(-1))}
    else if(t.hasAttribute('data-next')){
      if(state.step===6&&!state.submitted){state.submitted=true;state.submittedAt=today();save();render();top()}
      else{if(state.step===6)state.mod='aval';go(state.step===6?7:neighbor(1))}
    }
    else if(t.hasAttribute('data-reset')){confirmReset=true;render()}
    else if(t.hasAttribute('data-cancel-reset')){confirmReset=false;render()}
    else if(t.hasAttribute('data-confirm-reset')){var keepMod=state.mod,keepArea=state.area;state=fresh(state.role);state.mod=keepMod;state.area=keepArea;confirmReset=false;errs={};save();render();top()}
  });

  function onField(e){
    var el=e.target,bind=el.getAttribute&&el.getAttribute('data-bind');
    if(el.hasAttribute&&el.hasAttribute('data-search')){ldQuery=el.value;applyFilter();return}
    if(el.hasAttribute&&el.hasAttribute('data-msearch')){mQuery=el.value;applyMFilter();return}
    if(el.hasAttribute&&el.hasAttribute('data-pdi')){
      var sp=el.getAttribute('data-pdi').split('|'),ob=(state.pdi[pdiEditId]||[]).filter(function(o){return o.id===sp[1]})[0];
      if(ob){
        if(sp[0]==='o'&&sp[2]==='titulo')ob.titulo=el.value.slice(0,90);
        else if(sp[0]==='o'&&sp[2]==='prazo')ob.prazo=el.value;
        else if(sp[0]==='a'){var ac=(ob.acoes||[]).filter(function(a){return a.id===sp[2]})[0];if(ac)ac.t=el.value.slice(0,120)}
      }
      save();return;
    }
    if(bind){
      setPath(bind,el.value);
      var m=bind.match(/^mv\.nivel\.([^.]+)\.evid$/);
      if(m){var nn=state.mv.nivel[m[1]];if(nn&&(nn.status==='proposto'||nn.status==='conversar')){nn.status='rascunho'}}
      if(bind==='mv.avaliacao')updateAval();
      save();
      if(e.type==='change')softNav();
      return;
    }
    var f=el.getAttribute&&el.getAttribute('data-field');if(!f)return;
    if(f==='goal')state.goal=el.value;else state.profile[f]=el.value;
    save();
    if(e.type==='change')softNav();
  }
  document.addEventListener('input',onField);
  document.addEventListener('change',onField);
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target&&e.target.id==='f-skillnew'){e.preventDefault();var bsk=document.querySelector('[data-addskill]');if(bsk)bsk.click()}
    if(e.key==='Escape'&&calOpen){calOpen=false;render();var tgb=document.querySelector('[data-key="caltoggle"]');if(tgb)tgb.focus()}
    if(e.key==='Enter'&&e.target&&e.target.id==='f-novoTema'){e.preventDefault();addTema()}
    if(e.key==='Enter'&&e.target&&(e.target.id==='f-mnome'||e.target.id==='f-mcargo')){e.preventDefault();addMember()}
  });

  render();
})();
</script>
</body>
</html>
